{% extends 'core/base.html' %}{% block content %}<style>.theme-picker{display:grid;gap:12px;margin-bottom:14px}.theme-picker h2{margin:0}.theme-picker select{max-width:280px}.theme-colors{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.theme-color{min-height:110px;border-radius:12px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid #0001}.theme-color small{font:11px "DM Mono"}</style><div class="platform-head"><div><p class="kicker">Platform control centre</p><h1>Theme</h1></div></div><nav class="subnav"><a href="{% url 'platform-dashboard' %}">Overview</a><a href="{% url 'platform-people' %}">People</a><a href="{% url 'platform-courses' %}">Courses</a><a href="{% url 'platform-theme' %}" aria-current="page">Theme</a><a href="{% url 'platform-audit' %}">Audit log</a></nav><section class="surface theme-panel"><div class="logo-upload"><h2>Logo</h2><form method="post" enctype="multipart/form-data">{% csrf_token %}<input type="file" name="logo" accept="image/png,image/jpeg,image/svg+xml" required><button class="primary-btn">Upload logo</button></form>{% if brand_settings and brand_settings.logo %}<p class="muted">Current logo: {{ brand_settings.logo.name }}</p>{% endif %}</div><div class="theme-picker"><h2>Pallette</h2><select id="theme-select" data-theme-select><option value="charcoal">Charcoal</option><option value="moss-ink">Moss &amp; Ink</option><option value="midnight-tide">Midnight Tide</option><option value="mexico">Mexico</option><option value="redbrick-mersey">Redbrick Mersey</option><option value="asimov">Asimov</option><option value="gardners-world">Gardners World</option><option value="oxford">Oxford</option></select></div><div class="theme-colors" data-theme-colors></div></section><script>const palettes={charcoal:[['Charcoal','#171717'],['Paper','#F4F3EF'],['Surface','#FFFFFF'],['Line','#E1E0DC'],['Muted','#6D6C67'],['Soft','#ECEBE7']], 'moss-ink':[['Moss','#17352B'],['Mist','#F3F7F1'],['Surface','#FFFFFF'],['Line','#D7E3D8'],['Sage','#52685B'],['Soft','#E4F0E5']], 'midnight-tide':[['Navy','#102A43'],['Ice','#F2F7FC'],['Surface','#FFFFFF'],['Line','#C9D8E8'],['Muted Blue','#486581'],['Mist','#E6EEF7']], 'mexico':[['Forest','#006847'],['Cream','#FFF8E7'],['Surface','#FFFFFF'],['Line','#D9C7A3'],['Red','#CE1126'],['Gold','#D4A72C']], 'redbrick-mersey':[['Navy','#0B1F3A'],['Chalk','#F7F4EE'],['Surface','#FFFFFF'],['Line','#D7DCE5'],['Redbrick','#C95C45'],['Mersey','#2A9D8F']], 'asimov':[['Deep Space','#0B1020'],['Starlight','#F4F7FB'],['Surface','#FFFFFF'],['Line','#CBD5E1'],['Cyan','#00B8D9'],['Violet','#7C5CFC']], 'gardners-world':[['Forest','#234F32'],['Leaf','#F1F6E9'],['Surface','#FFFFFF'],['Line','#CFDCC5'],['Moss','#557A4E'],['Bloom','#D46A8A']], 'oxford':[['Oxford Blue','#002147'],['Parchment','#F7F5F0'],['Surface','#FFFFFF'],['Line','#D7DCE2'],['Slate','#536273'],['Gold','#B08D3C']]};const select=document.querySelector('[data-theme-select]'),colors=document.querySelector('[data-theme-colors]');const draw=()=>{const items=palettes[select.value];const luminance=(hex)=>{const rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2]};const contrast=(a,b)=>{const l1=luminance(a),l2=luminance(b);return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05)};colors.innerHTML=items.map(([name,hex])=>{const ink=contrast(hex,'#171717'),light=contrast(hex,'#FFFFFF'),text=light>=ink?'#FFFFFF':'#171717';return '<div class="theme-color" style="background:'+hex+';color:'+text+'"><strong>'+name+'</strong><small>'+hex+'</small></div>'}).join('')};const saved=localStorage.getItem('minivle-theme')||'charcoal';select.value=palettes[saved]?saved:'charcoal';draw();select.addEventListener('change',()=>{localStorage.setItem('minivle-theme',select.value);document.documentElement.dataset.theme=select.value;draw()});</script>{% endblock %}
