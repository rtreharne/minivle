services:
  web:
    build: .
    ports: ["8001:8000"]
    environment:
      DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,host.docker.internal,testserver,demo.minivle.com
      CSRF_TRUSTED_ORIGINS: https://demo.minivle.com
      SECRET_KEY: change-this-before-production
      LTI_ISSUER: https://demo.minivle.com
      POSTGRES_HOST: db
      POSTGRES_DB: minivle
      POSTGRES_USER: minivle
      POSTGRES_PASSWORD: minivle
      AWS_STORAGE_BUCKET_NAME: minivle
      AWS_S3_ENDPOINT_URL: http://objectstore:8333
      AWS_ACCESS_KEY_ID: minivle
      AWS_SECRET_ACCESS_KEY: minivle-local-only
      LTI_PRIVATE_KEY_FILE: /run/secrets/lti_private_key
      LTI_DEPLOYMENT_SYNC_SECRET: minivle-counter-deployment-sync-local
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
      objectstore: {condition: service_started}
      lti-key-init: {condition: service_completed_successfully}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - lti_secrets:/run/secrets:ro
      # Keep application code, templates, and static assets live in development.
      - ./core:/app/core:ro
  cloudflared:
    image: cloudflare/cloudflared:2026.3.0
    user: "1000:1000"
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    restart: unless-stopped
    depends_on:
      - web
    volumes:
      - ./cloudflared-minivle/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared-minivle/credentials.json:/etc/cloudflared/credentials.json:ro
  lti-key-init:
    build: .
    user: root
    command:
      - sh
      - -ec
      - |
        if [ ! -s /run/secrets/lti_private_key ]; then
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /run/secrets/lti_private_key
        fi
        chown app:app /run/secrets/lti_private_key
        chmod 600 /run/secrets/lti_private_key
    volumes:
      - lti_secrets:/run/secrets
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: minivle
      POSTGRES_USER: minivle
      POSTGRES_PASSWORD: minivle
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minivle -d minivle"]
      interval: 2s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
  objectstore:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data
    ports: ["8333:8333"]
    volumes: [objectstore_data:/data]
volumes:
  postgres_data:
  objectstore_data:
  lti_secrets:
